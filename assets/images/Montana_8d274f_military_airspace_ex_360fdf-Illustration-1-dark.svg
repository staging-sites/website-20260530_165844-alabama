    --accent-1: #93c5fd;
    --accent-2: #86efac;
    --accent-3: #fcd34d;
    --accent-4: #f9a8d4;
    --accent-5: #c4b5fd;
    --accent-6: #a5f3fc;
}
:root[data-theme="dark"] {
    --background: #0f172a;
    --panel: #1e293b;
    --primary-text: #f1f5f9;
    --muted-text: #94a3b8;
